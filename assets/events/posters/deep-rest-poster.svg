<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img" aria-labelledby="title description">
  <title id="title">DEEP REST — Event poster</title>
  <desc id="description">Poster for DEEP REST: a small-group evening of Breathwork, Yoga Nidra and a live handpan sound journey at ZEN CENTER Regensburg on 11 December 2026.</desc>
  <defs>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062f3c" stop-opacity=".47"/>
      <stop offset=".4" stop-color="#062f3c" stop-opacity=".08"/>
      <stop offset=".66" stop-color="#062f3c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#062f3c" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="information-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062f3c" stop-opacity="0"/>
      <stop offset=".18" stop-color="#062f3c" stop-opacity=".6"/>
      <stop offset="1" stop-color="#062f3c" stop-opacity=".93"/>
    </linearGradient>
  </defs>
  <image href="../deep-rest-handpan-poster.png" x="0" y="0" width="1080" height="1620" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1620" fill="url(#atmosphere)"/>
  <rect y="920" width="1080" height="700" fill="url(#information-panel)"/>
  <rect x="48" y="48" width="984" height="1524" rx="2" fill="none" stroke="#e6c990" stroke-opacity=".62" stroke-width="1"/>
  <g fill="#f6f0e6" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="540" y="126" font-size="17" font-weight="700" letter-spacing="5">HUMAN ARCHITECTURE®</text>
    <line x1="448" y1="160" x2="632" y2="160" stroke="#e6c990" stroke-width="1"/>
    <text x="540" y="370" font-family="Georgia, serif" font-size="148" letter-spacing="-8">DEEP</text>
    <text x="540" y="505" font-family="Georgia, serif" font-size="148" letter-spacing="-8">REST</text>
    <text x="540" y="558" fill="#e6c990" font-size="16" font-weight="700" letter-spacing="3.1">BREATHWORK · YOGA NIDRA · LIVE-HANDPAN-KLANGREISE</text>
    <text x="540" y="610" font-size="17" letter-spacing="1">Ein kleiner, gehaltener Abend zum Ankommen, Loslassen und Ruhen.</text>
    <line x1="176" y1="1050" x2="904" y2="1050" stroke="#e6c990" stroke-opacity=".7" stroke-width="1"/>
    <text x="540" y="1108" font-size="23" font-weight="700" letter-spacing="2">FREITAG · 11. DEZEMBER 2026</text>
    <text x="540" y="1154" font-size="21" letter-spacing="1.1">18:00–19:30 UHR · ENTSPANNTEN PUFFER BIS 20:00 UHR EINPLANEN</text>
    <text x="540" y="1208" fill="#e6c990" font-size="21" font-weight="700" letter-spacing="2">ZEN CENTER · REGENSBURG</text>
    <line x1="176" y1="1248" x2="904" y2="1248" stroke="#e6c990" stroke-opacity=".7" stroke-width="1"/>
    <text x="540" y="1302" font-size="18" font-weight="700" letter-spacing="2.2">18 PLÄTZE · 28 € · 25 € PRO PERSON ZU ZWEIT</text>
    <text x="540" y="1352" font-size="15" letter-spacing="1.1">BITTE MITBRINGEN: YOGAMATTE · SCHAL ODER KLEINE, WEICHE DECKE</text>
    <line x1="356" y1="1400" x2="724" y2="1400" stroke="#e6c990" stroke-opacity=".65" stroke-width="1"/>
    <text x="540" y="1452" fill="#e6c990" font-size="16" font-weight="700" letter-spacing="2.4">DEINEN PLATZ SICHERN</text>
    <text x="540" y="1490" font-size="14" letter-spacing="1.6">HUMAN-ARCHITECTURE.INFO/EVENTS/DEEP-REST</text>
